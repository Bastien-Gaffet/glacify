# /etc/nginx/sites-available/glacify.conf
# Le port 443 public est multiplexé par le bloc `stream` de nginx.conf
# (ssl_preread) : les vhosts HTTPS écoutent sur 127.0.0.1:8443, jamais sur 443.
# Certificat (webroot, renouvellement automatique) :
#   certbot certonly --webroot -w /var/www/glacify-acme -d glacify.bastiengaffet.fr

limit_req_zone $binary_remote_addr zone=glacify_api:10m rate=10r/s;

server {
    server_name glacify.bastiengaffet.fr;

    client_max_body_size 256k;

    # Test APK, downloaded from the phone (copied there after each Android build)
    location = /glacify.apk {
        alias /opt/glacify/apk/glacify-debug.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="glacify.apk"';
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        limit_req zone=glacify_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8103;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8103;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 127.0.0.1:8443 ssl;
    ssl_certificate /etc/letsencrypt/live/glacify.bastiengaffet.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glacify.bastiengaffet.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name glacify.bastiengaffet.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/glacify-acme;
    }
    location / {
        return 301 https://glacify.bastiengaffet.fr$request_uri;
    }
}
